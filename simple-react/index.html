<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Library Management System</title>

  <!-- ✅ Load React, ReactDOM, Babel and Axios from CDN (no npm needed) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    /* Navigation Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background-color: #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    .tab-btn.active {
      background-color: #4a90e2;
      color: white;
    }

    /* Input and Button styles */
    input, select {
      padding: 8px;
      margin: 5px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 200px;
    }

    button {
      padding: 8px 16px;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .btn-blue   { background-color: #4a90e2; color: white; }
    .btn-red    { background-color: #e74c3c; color: white; }
    .btn-green  { background-color: #27ae60; color: white; }
    .btn-orange { background-color: #e67e22; color: white; }

    /* Table styles */
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 15px;
    }

    th {
      background-color: #4a90e2;
      color: white;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    tr:hover { background-color: #f0f0f0; }

    /* Form box */
    .form-box {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
    }

    .form-box h3 {
      margin-top: 0;
      color: #333;
    }

    /* Message */
    .message {
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
      font-weight: bold;
    }

    .success { background-color: #d4edda; color: #155724; }
    .error   { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- ✅ type="text/babel" lets Babel compile JSX in the browser -->
  <script type="text/babel">

    // ============================================================
    //  SPRING BOOT BASE URL
    //  Change this to match your Spring Boot server URL
    // ============================================================
    const BASE_URL = "http://localhost:8080";


    // ============================================================
    //  BOOKS PAGE
    // ============================================================
    function BooksPage() {
      const [books,    setBooks]    = React.useState([]);
      const [title,    setTitle]    = React.useState("");
      const [author,   setAuthor]   = React.useState("");
      const [bookId,   setBookId]   = React.useState("");
      const [quantity, setQuantity] = React.useState("");
      const [message,  setMessage]  = React.useState(null);

      // Fetch all books from Spring Boot
      const fetchBooks = () => {
        axios.get(`${BASE_URL}/books`)
          .then(response => {
            setBooks(response.data);
          })
          .catch(error => {
            setMessage({ text: "Error loading books: " + error.message, type: "error" });
          });
      };

      // Load books when page opens
      React.useEffect(() => {
        fetchBooks();
      }, []);

      // Add a new book
      const addBook = () => {
        axios.post(`${BASE_URL}/books`, {
          bookId:   parseInt(bookId),
          title:    title,
          author:   author,
          quantity: parseInt(quantity)
        })
        .then(response => {
          setMessage({ text: "Book added successfully!", type: "success" });
          setTitle(""); setAuthor(""); setBookId(""); setQuantity("");
          fetchBooks();
        })
        .catch(error => {
          setMessage({ text: "Error adding book: " + error.message, type: "error" });
        });
      };

      // Delete a book
      const deleteBook = (id) => {
        axios.delete(`${BASE_URL}/books/${id}`)
          .then(response => {
            setMessage({ text: "Book deleted!", type: "success" });
            fetchBooks();
          })
          .catch(error => {
            setMessage({ text: "Error deleting book: " + error.message, type: "error" });
          });
      };

      return (
        <div>
          <h2>📚 Books</h2>

          {/* Show success or error message */}
          {message && (
            <div className={`message ${message.type}`}>{message.text}</div>
          )}

          {/* Add Book Form */}
          <div className="form-box">
            <h3>Add New Book</h3>
            <input
              type="number"
              placeholder="Book ID"
              value={bookId}
              onChange={e => setBookId(e.target.value)}
            />
            <input
              type="text"
              placeholder="Title"
              value={title}
              onChange={e => setTitle(e.target.value)}
            />
            <input
              type="text"
              placeholder="Author"
              value={author}
              onChange={e => setAuthor(e.target.value)}
            />
            <input
              type="number"
              placeholder="Quantity"
              value={quantity}
              onChange={e => setQuantity(e.target.value)}
            />
            <button className="btn-blue" onClick={addBook}>Add Book</button>
          </div>

          {/* Books Table */}
          <table>
            <thead>
              <tr>
                <th>Book ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Quantity</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              {books.map(book => (
                <tr key={book.bookId}>
                  <td>{book.bookId}</td>
                  <td>{book.title}</td>
                  <td>{book.author}</td>
                  <td>{book.quantity}</td>
                  <td>
                    <button className="btn-red" onClick={() => deleteBook(book.bookId)}>
                      Delete
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }


    // ============================================================
    //  USERS PAGE
    // ============================================================
    function UsersPage() {
      const [users,   setUsers]   = React.useState([]);
      const [userId,  setUserId]  = React.useState("");
      const [name,    setName]    = React.useState("");
      const [type,    setType]    = React.useState("Student");
      const [message, setMessage] = React.useState(null);

      // Fetch all users from Spring Boot
      const fetchUsers = () => {
        axios.get(`${BASE_URL}/users`)
          .then(response => {
            setUsers(response.data);
          })
          .catch(error => {
            setMessage({ text: "Error loading users: " + error.message, type: "error" });
          });
      };

      React.useEffect(() => {
        fetchUsers();
      }, []);

      // Add a new user
      const addUser = () => {
        axios.post(`${BASE_URL}/users`, {
          userId: parseInt(userId),
          name:   name,
          type:   type
        })
        .then(response => {
          setMessage({ text: "User added successfully!", type: "success" });
          setUserId(""); setName(""); setType("Student");
          fetchUsers();
        })
        .catch(error => {
          setMessage({ text: "Error adding user: " + error.message, type: "error" });
        });
      };

      // Delete a user
      const deleteUser = (id) => {
        axios.delete(`${BASE_URL}/users/${id}`)
          .then(response => {
            setMessage({ text: "User deleted!", type: "success" });
            fetchUsers();
          })
          .catch(error => {
            setMessage({ text: "Error deleting user: " + error.message, type: "error" });
          });
      };

      return (
        <div>
          <h2>👥 Users</h2>

          {message && (
            <div className={`message ${message.type}`}>{message.text}</div>
          )}

          {/* Add User Form */}
          <div className="form-box">
            <h3>Add New User</h3>
            <input
              type="number"
              placeholder="User ID"
              value={userId}
              onChange={e => setUserId(e.target.value)}
            />
            <input
              type="text"
              placeholder="Name"
              value={name}
              onChange={e => setName(e.target.value)}
            />
            <select value={type} onChange={e => setType(e.target.value)}>
              <option value="Student">Student</option>
              <option value="Admin">Admin</option>
            </select>
            <button className="btn-blue" onClick={addUser}>Add User</button>
          </div>

          {/* Users Table */}
          <table>
            <thead>
              <tr>
                <th>User ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              {users.map(user => (
                <tr key={user.userId}>
                  <td>{user.userId}</td>
                  <td>{user.name}</td>
                  <td>{user.type}</td>
                  <td>
                    <button className="btn-red" onClick={() => deleteUser(user.userId)}>
                      Delete
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }


    // ============================================================
    //  ISSUED BOOKS PAGE
    // ============================================================
    function IssuedBooksPage() {
      const [issues,   setIssues]  = React.useState([]);
      const [bookId,   setBookId]  = React.useState("");
      const [userId,   setUserId]  = React.useState("");
      const [returnId, setReturnId]= React.useState("");
      const [message,  setMessage] = React.useState(null);

      // Fetch all issued books from Spring Boot
      const fetchIssues = () => {
        axios.get(`${BASE_URL}/issues`)
          .then(response => {
            setIssues(response.data);
          })
          .catch(error => {
            setMessage({ text: "Error loading issues: " + error.message, type: "error" });
          });
      };

      React.useEffect(() => {
        fetchIssues();
      }, []);

      // Issue a book
      const issueBook = () => {
        axios.post(`${BASE_URL}/issues`, {
          bookId: parseInt(bookId),
          userId: parseInt(userId)
        })
        .then(response => {
          setMessage({ text: "Book issued successfully!", type: "success" });
          setBookId(""); setUserId("");
          fetchIssues();
        })
        .catch(error => {
          setMessage({ text: "Error issuing book: " + error.message, type: "error" });
        });
      };

      // Return a book
      const returnBook = () => {
        axios.put(`${BASE_URL}/issues/${returnId}/return`)
          .then(response => {
            setMessage({ text: "Book returned successfully!", type: "success" });
            setReturnId("");
            fetchIssues();
          })
          .catch(error => {
            setMessage({ text: "Error returning book: " + error.message, type: "error" });
          });
      };

      return (
        <div>
          <h2>📋 Issued Books</h2>

          {message && (
            <div className={`message ${message.type}`}>{message.text}</div>
          )}

          {/* Issue Book Form */}
          <div className="form-box">
            <h3>Issue a Book</h3>
            <input
              type="number"
              placeholder="Book ID"
              value={bookId}
              onChange={e => setBookId(e.target.value)}
            />
            <input
              type="number"
              placeholder="User ID"
              value={userId}
              onChange={e => setUserId(e.target.value)}
            />
            <button className="btn-green" onClick={issueBook}>Issue Book</button>
          </div>

          {/* Return Book Form */}
          <div className="form-box">
            <h3>Return a Book</h3>
            <input
              type="number"
              placeholder="Issue ID"
              value={returnId}
              onChange={e => setReturnId(e.target.value)}
            />
            <button className="btn-orange" onClick={returnBook}>Return Book</button>
          </div>

          {/* Issued Books Table */}
          <table>
            <thead>
              <tr>
                <th>Issue ID</th>
                <th>Book ID</th>
                <th>User ID</th>
                <th>Issue Date</th>
                <th>Return Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {issues.map(issue => (
                <tr key={issue.issueId}>
                  <td>{issue.issueId}</td>
                  <td>{issue.bookId}</td>
                  <td>{issue.userId}</td>
                  <td>{issue.issueDate ? new Date(issue.issueDate).toLocaleDateString() : "-"}</td>
                  <td>{issue.returnDate ? new Date(issue.returnDate).toLocaleDateString() : "-"}</td>
                  <td>{issue.returnDate ? "✅ Returned" : "⏳ Active"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }


    // ============================================================
    //  MAIN APP  –  Handles tab switching
    // ============================================================
    function App() {
      const [activePage, setActivePage] = React.useState("books");

      return (
        <div>
          <h1>📖 Library Management System</h1>

          {/* Tab Navigation */}
          <div className="tabs">
            <button
              className={`tab-btn ${activePage === "books" ? "active" : ""}`}
              onClick={() => setActivePage("books")}
            >
              📚 Books
            </button>
            <button
              className={`tab-btn ${activePage === "users" ? "active" : ""}`}
              onClick={() => setActivePage("users")}
            >
              👥 Users
            </button>
            <button
              className={`tab-btn ${activePage === "issues" ? "active" : ""}`}
              onClick={() => setActivePage("issues")}
            >
              📋 Issued Books
            </button>
          </div>

          {/* Show the selected page */}
          {activePage === "books"  && <BooksPage />}
          {activePage === "users"  && <UsersPage />}
          {activePage === "issues" && <IssuedBooksPage />}
        </div>
      );
    }

    // ============================================================
    //  Render the App into the page
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

  </script>

</body>
</html>
